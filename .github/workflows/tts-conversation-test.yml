name: Prueba conversación TTS Supertonic

on:
  push:
    branches:
      - test/tts-supertonic
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install supertonic scipy

      - name: Instalar FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generar conversación F1 + M1 a 1,25x
        run: |
          cat > /tmp/generate_conversation.py <<'PY'
          from pathlib import Path
          import subprocess
          from supertonic import TTS

          out = Path('conversation_audio')
          out.mkdir(exist_ok=True)

          tts = TTS(auto_download=True)

          lines = [
              ('F1', 'Vale, venga. Vamos a hacerlo fácil: ¿qué es lo primero que tienes que recordar de la ecografía?', 'f1_01.wav'),
              ('M1', 'Que utiliza ondas mecánicas para formar la imagen, ¿no?', 'm1_01.wav'),
              ('F1', 'Exacto. Y esas ondas las genera y las recibe el transductor. Ahí entra en juego el efecto piezoeléctrico.', 'f1_02.wav'),
              ('M1', 'Que transforma la energía eléctrica en vibración mecánica y luego hace el proceso al revés con los ecos.', 'm1_02.wav'),
              ('F1', '¡Eso es! Y a partir de ahí aparecen frecuencia, longitud de onda, amplitud, potencia, intensidad e impedancia acústica.', 'f1_03.wav'),
              ('M1', 'O sea, que parece una barbaridad de teoría, pero en realidad la idea es bastante lógica.', 'm1_03.wav'),
              ('F1', 'Exactamente. Mandamos una onda, esperamos a que vuelva, medimos lo que ha pasado y con esa información construimos la imagen.', 'f1_04.wav'),
              ('M1', 'Vale. Así contado sí parece bastante menos terrorífico.', 'm1_04.wav'),
          ]

          for voice, text, filename in lines:
              print(f'Generando {voice}: {text}')
              wav, _ = tts(text=text, lang='es', voice_style=voice, total_steps=10, speed=1.25)
              wav.save(out / filename)

          concat = out / 'concat.txt'
          with concat.open('w', encoding='utf-8') as f:
              for _, _, filename in lines:
                  f.write(f"file '{filename}'\\n")

          subprocess.run([
              'ffmpeg', '-y', '-f', 'concat', '-safe', '0',
              '-i', str(concat), '-c:a', 'libmp3lame', '-q:a', '3',
              'radtechcrew-conversacion-f1-m1-125.mp3'
          ], check=True)
          PY
          python /tmp/generate_conversation.py

      - name: Subir conversación
        uses: actions/upload-artifact@v4
        with:
          name: radtechcrew-conversacion-f1-m1-125
          path: radtechcrew-conversacion-f1-m1-125.mp3
          retention-days: 7
